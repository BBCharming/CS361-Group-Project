<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to Zatcher to report fraud, track your case, and get help fast.">
    <title>Log in Page- Zatcher</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        
        .login-shell{
            min-height:calc(100vh - 64px);
            display:flex; align-items:center; justify-content:center;
            padding:48px 24px;
            position:relative; overflow:hidden;
            background:linear-gradient(135deg, #F0ECE2 0%, rgba(31,138,118,0.08) 100%);
        }
        .radar-mini{ position:absolute; top:32px; right:48px; width:150px; height:150px; z-index:1; }
        .radar-mini-ring{
            position:absolute; inset:0; border-radius:50%;
            border:1px solid rgba(31,138,118,0.25);
            animation:radar-expand 3.6s ease-out infinite;
        }
        .radar-mini-ring.r2{ animation-delay:1.2s; }
        .radar-mini-core{
            position:absolute; left:50%; top:50%; width:9px; height:9px;
            background:#C1652F; border-radius:50%; transform:translate(-50%,-50%);
        }
        @keyframes radar-expand{
            0%{ transform:scale(0.15); opacity:0.9; }
            100%{ transform:scale(1); opacity:0; }
        }

        .login-box{
            width:100%; max-width:340px;
            background:#fff; border:2px solid #1F8A76; border-radius:16px;
            padding:32px 28px 28px; position:relative; z-index:2;
            text-align:center;
            box-shadow:0 8px 32px rgba(31,138,118,0.12);
        }
       
        .login-box .form-row, .login-box .row-between{ text-align:left; margin-bottom:14px; }
        .login-box .form-group label{ display:block; font-size:12px; font-weight:600; margin-bottom:5px; color:#10201C; }
        .login-box .form-group input{
            width:100%; padding:9px 12px; border-radius:8px;
            border:1px solid #E2DCCB; font-size:14px; outline:none;
            transition:border-color .15s, box-shadow .15s;
        }
        .login-box .form-group input:focus{
            border-color:#2F6FED; box-shadow:0 0 0 3px rgba(47,111,237,0.15);
        }
        .login-box .row-between{ display:flex; justify-content:flex-end; margin:-4px 0 16px; }
        .login-box .link-quiet{ font-size:12px; color:#1F8A76; text-decoration:none; font-weight:600; }
        .login-box .link-quiet:hover{ text-decoration:underline; color:#2F6FED; }

        .login-box .submit-btn{
            display:inline-block; width:auto; min-width:160px;
            padding:10px 24px; border:none; border-radius:8px;
            background:#2F6FED; color:#F5F1E8; font-weight:600; font-size:14px;
            cursor:pointer; transition:background .15s, transform .1s;
        }
        .login-box .submit-btn:hover{ background:#1E54C6; }
        .login-box .submit-btn:active{ transform:scale(0.98); }
        .login-box .submit-btn.secondary{
            background:transparent; color:#10201C; border:1px solid #E2DCCB;
            display:block; width:auto; min-width:160px; margin:0 auto;
        }
        .login-box .submit-btn.secondary:hover{ background:#F0ECE2; }

        .login-box .divider{
            display:flex; align-items:center; gap:10px; margin:18px 0;
            color:#4B5A55; font-size:11px;
        }
        .login-box .divider::before, .login-box .divider::after{
            content:''; flex:1; height:1px; background:#1F8A76;
        }

        .login-greeting{
            font-size:15px; font-weight:700; margin:0 0 2px; color:#10201C;
            display:flex; align-items:center; justify-content:center; gap:5px;
            animation:fade-wave-in 1.1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .wave{ display:inline-block; transform-origin:70% 70%; animation:wave-bounce 1.4s ease-in-out 1.1s infinite; }
        @keyframes fade-wave-in{
            0%{ opacity:0; transform:translateY(10px); }
            60%{ opacity:1; transform:translateY(-2px); }
            100%{ opacity:1; transform:translateY(0); }
        }
        @keyframes wave-bounce{
            0%, 60%, 100%{ transform:rotate(0deg); }
            10%{ transform:rotate(14deg); }
            20%{ transform:rotate(-8deg); }
            30%{ transform:rotate(14deg); }
            40%{ transform:rotate(-4deg); }
            50%{ transform:rotate(10deg); }
        }
        @media (prefers-reduced-motion: reduce){
            .login-greeting, .wave, .radar-mini-ring{ animation:none; }
        }

        .login-title{
            font-family:'Space Grotesk', sans-serif; font-size:26px; font-weight:700;
            margin:6px 0 18px; color:#10201C;
            background:linear-gradient(90deg, #1F8A76, #2F6FED);
            -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
        }
        .login-tagline{
            text-align:center; font-size:12px; color:#4B5A55;
            margin:14px 0 0; line-height:1.5;
        }
        .login-box .form-message{ font-size:12px; margin:10px 0 0; min-height:1em; }
        .login-box .form-message.error{ color:#B3432F; }
        .login-box .form-message.success{ color:#1F8A76; }

        @media (max-width: 480px){
            .radar-mini{ display:none; }
            .login-box{ max-width:300px; padding:26px 20px 22px; }
        }
    </style>
</head>
<body class="auth-page">
    <!-- Navigation -->
    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html" aria-label="Zatcher Home">
                    <h2>Zatcher</h2>
                    <p class="tagline">Fraud Reporting Platform</p>
                </a>
            </div>
            <button class="mobile-menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
                <span class="hamburger"></span>
            </button>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="login.html" class="nav-btn login-btn">Login </a></li>
                <li><a href="register.html" class="nav-btn register-btn">Register</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="login-shell">
        <div class="radar-mini" aria-hidden="true">
            <div class="radar-mini-ring r1"></div>
            <div class="radar-mini-ring r2"></div>
            <div class="radar-mini-core"></div>
        </div>

        <div class="login-box">
            <p class="login-greeting"><span class="wave">👋</span> Welcome to Zatcher!</p>
            <h1 class="login-title">Login</h1>

            <form class="auth-form" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullName">Full name</label>
                        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required autocomplete="name">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                </div>

                <div class="row-between">
                    <a href="forgot-password.html" class="link-quiet">Forgot password?</a>
                </div>

                <button type="submit" class="submit-btn">Log in</button>
                <p class="form-message" role="status" aria-live="polite"></p>
            </form>

            <p class="login-tagline">Every report brings us one step closer to catching them.</p>

            <div class="divider">New to Zatcher</div>
            <a href="register.html" class="submit-btn secondary" style="text-decoration:none;">Create an account</a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="placeholder-footer">
        <p>&copy; 2026 Zatcher. All rights reserved. | <a href="index.html" style="color: rgba(255,255,255,0.7);">Home</a></p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.querySelector('.mobile-menu-toggle');
            const navLinks = document.querySelector('.nav-links');
            if (menuToggle && navLinks) {
                menuToggle.addEventListener('click', function() {
                    const isExpanded = this.getAttribute('aria-expanded') === 'true';
                    this.setAttribute('aria-expanded', !isExpanded);
                    navLinks.classList.toggle('active');
                    this.classList.toggle('active');
                });
                document.addEventListener('click', function(e) {
                    if (!navLinks.contains(e.target) && !menuToggle.contains(e.target)) {
                        navLinks.classList.remove('active');
                        menuToggle.classList.remove('active');
                        menuToggle.setAttribute('aria-expanded', 'false');
                    }
                });
            }

            const form = document.querySelector('.auth-form');
            const message = document.querySelector('.form-message');
            form.addEventListener('submit', function(e){
                e.preventDefault();
                const name = document.getElementById('fullName').value.trim();
                const pass = document.getElementById('password').value;
                if(!name || !pass){
                    message.textContent = 'Enter your full name and password.';
                    message.className = 'form-message error';
                    return;
                }
                message.textContent = 'Logged in. Redirecting to your dashboard…';
                message.className = 'form-message success';
            });
        });
    </script>
</body>
</html>
