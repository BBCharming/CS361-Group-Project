<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your Zatcher password.">
    <title>Reset password - Zatcher</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .login-shell{
            min-height:calc(100vh - 64px);
            display:flex; align-items:center; justify-content:center;
            padding:48px 24px;
            position:relative; overflow:hidden;
            background:linear-gradient(135deg, #F0ECE2 0%, rgba(31,138,118,0.08) 100%);
        }
        .login-box{
            width:100%; max-width:340px;
            background:#fff; border:2px solid #1F8A76; border-radius:16px;
            padding:32px 28px 28px; position:relative; z-index:2;
            text-align:center;
            box-shadow:0 8px 32px rgba(31,138,118,0.12);
        }
        .login-box .form-row{ text-align:left; margin-bottom:14px; }
        .login-box .form-group label{ display:block; font-size:12px; font-weight:600; margin-bottom:5px; color:#10201C; }
        .login-box .form-group input{
            width:100%; padding:9px 12px; border-radius:8px;
            border:1px solid #E2DCCB; font-size:14px; outline:none;
            transition:border-color .15s, box-shadow .15s;
        }
        .login-box .form-group input:focus{
            border-color:#2F6FED; box-shadow:0 0 0 3px rgba(47,111,237,0.15);
        }
        .login-box .submit-btn{
            display:inline-block; width:auto; min-width:180px;
            padding:10px 24px; border:none; border-radius:8px;
            background:#2F6FED; color:#F5F1E8; font-weight:600; font-size:14px;
            cursor:pointer; transition:background .15s, transform .1s;
        }
        .login-box .submit-btn:hover{ background:#1E54C6; }
        .login-title{
            font-family:'Space Grotesk', sans-serif; font-size:24px; font-weight:700;
            margin:6px 0 18px; color:#10201C;
            background:linear-gradient(90deg, #1F8A76, #2F6FED);
            -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
        }
        .login-box .field-hint{ font-size:12px; color:#4B5A55; margin:0 0 16px; text-align:left; }
        .login-box .form-message{ font-size:12px; margin:10px 0 0; min-height:1em; }
        .login-box .form-message.error{ color:#B3432F; }
        .login-box .form-message.success{ color:#1F8A76; }
        .step{ display:none; }
        .step.active{ display:block; }
        .form-footer{ text-align:center; font-size:12px; color:#4B5A55; margin-top:16px; }
        .form-footer a{ color:#1F8A76; font-weight:600; text-decoration:none; }
        .form-footer a:hover{ text-decoration:underline; }
        @media (max-width: 480px){
            .login-box{ max-width:300px; padding:26px 20px 22px; }
        }
    </style>
</head>
<body class="auth-page">
    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html" aria-label="Zatcher Home">
                    <h2>Zatcher</h2>
                    <p class="tagline">Fraud Reporting Platform</p>
                </a>
            </div>
            <button class="mobile-menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
                <span class="hamburger"></span>
            </button>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="login.html" class="nav-btn login-btn">Login</a></li>
                <li><a href="register.html" class="nav-btn register-btn">Register</a></li>
            </ul>
        </div>
    </nav>

    <main class="login-shell">
        <div class="login-box">
            <h1 class="login-title">Reset your password</h1>

            <form class="auth-form step active" id="step1" novalidate>
                <div class="form-row">
                    <div class="form-group" style="text-align:left;">
                        <label for="email">Email address</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                    </div>
                </div>
                <button type="submit" class="submit-btn">Send reset code</button>
                <p class="form-message" id="msg1" role="status" aria-live="polite"></p>
            </form>

            <form class="auth-form step" id="step2" novalidate>
                <p class="field-hint">Code sent to <strong id="emailEcho"></strong>. Enter it below with your new password.</p>
                <div class="form-row">
                    <div class="form-group" style="text-align:left;">
                        <label for="code">Reset code</label>
                        <input type="text" id="code" name="code" placeholder="6-digit code" required inputmode="numeric">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="text-align:left;">
                        <label for="newPassword">New password</label>
                        <input type="password" id="newPassword" name="newPassword" minlength="8" placeholder="At least 8 characters" required autocomplete="new-password">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="text-align:left;">
                        <label for="confirmNewPassword">Confirm new password</label>
                        <input type="password" id="confirmNewPassword" name="confirmNewPassword" minlength="8" placeholder="Re-enter new password" required autocomplete="new-password">
                    </div>
                </div>
                <button type="submit" class="submit-btn">Set new password</button>
                <p class="form-message" id="msg2" role="status" aria-live="polite"></p>
            </form>

            <p class="form-footer">Remembered it after all? <a href="login.html">Back to login</a></p>
        </div>
    </main>

    <footer class="placeholder-footer">
        <p>&copy; 2026 Zatcher. All rights reserved. | <a href="index.html" style="color: rgba(255,255,255,0.7);">Home</a></p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.querySelector('.mobile-menu-toggle');
            const navLinks = document.querySelector('.nav-links');
            if (menuToggle && navLinks) {
                menuToggle.addEventListener('click', function() {
                    const isExpanded = this.getAttribute('aria-expanded') === 'true';
                    this.setAttribute('aria-expanded', !isExpanded);
                    navLinks.classList.toggle('active');
                    this.classList.toggle('active');
                });
                document.addEventListener('click', function(e) {
                    if (!navLinks.contains(e.target) && !menuToggle.contains(e.target)) {
                        navLinks.classList.remove('active');
                        menuToggle.classList.remove('active');
                        menuToggle.setAttribute('aria-expanded', 'false');
                    }
                });
            }

            const step1 = document.getElementById('step1');
            const step2 = document.getElementById('step2');
            const msg1 = document.getElementById('msg1');
            const msg2 = document.getElementById('msg2');

            step1.addEventListener('submit', function(e){
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                if(!email){
                    msg1.textContent = 'Enter the email on your account.';
                    msg1.className = 'form-message error';
                    return;
                }
                document.getElementById('emailEcho').textContent = email;
                step1.classList.remove('active');
                step2.classList.add('active');
            });

            step2.addEventListener('submit', function(e){
                e.preventDefault();
                const pass = document.getElementById('newPassword').value;
                const confirm = document.getElementById('confirmNewPassword').value;
                if(pass.length < 8){
                    msg2.textContent = 'Password must be at least 8 characters.';
                    msg2.className = 'form-message error';
                    return;
                }
                if(pass !== confirm){
                    msg2.textContent = 'Passwords do not match.';
                    msg2.className = 'form-message error';
                    return;
                }
                msg2.textContent = 'Password updated. Redirecting to login…';
                msg2.className = 'form-message success';
                setTimeout(function(){ window.location.href = 'login.html'; }, 1200);
            });
        });
    </script>
</body>
</html>
